[project]
name = "solarguard-vision"
version = "1.0.0"
description = "SolarGuard Vision - Sistema inteligente de inspeção termográfica de usinas fotovoltaicas com IA e drones DJI Matrice 4T"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.3.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "Pillow>=10.2.0",
    "piexif>=1.1.3",
    "reportlab>=4.1.0",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "folium>=0.16.0",
    "pydantic>=2.6.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
training = [
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.0",
    "scipy>=1.12.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pyinstaller>=6.5.0",
]

[dependency-groups]
training = [
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.0",
    "scipy>=1.12.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pyinstaller>=6.5.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "scripts/*",
    "experiments/*",
    "data/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "experiments",
    "data",
    "reports",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length handled flexibly
    "E402",  # module level import not at top of file (necessário para setup offscreen do Qt)
    "E741",  # ambiguous variable name
    "F401",  # unused imports (mantidos para facilidade de exportação e compatibilidade)
    "F841",  # local variable assigned but never used
    "W291",  # trailing whitespace
    "W292",  # no newline at end of file
    "W293",  # blank line contains whitespace
    "E722",  # bare except
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
warn_redundant_casts = false
disable_error_code = [
    "attr-defined",
    "union-attr",
    "arg-type",
    "index",
    "var-annotated",
    "type-var",
    "return-value",
    "assignment",
    "call-arg",
    "call-overload",
    "misc",
    "no-redef",
]
exclude = [
    "tests/",
    "experiments/",
    "scripts/",
]
