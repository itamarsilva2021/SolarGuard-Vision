[project]
name = "solarguard-vision"
version = "1.0.0"
description = "SolarGuard Vision - Sistema inteligente de inspeção termográfica de usinas fotovoltaicas com IA e drones DJI Matrice 4T"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.3.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "Pillow>=10.2.0",
    "piexif>=1.1.3",
    "reportlab>=4.1.0",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "folium>=0.16.0",
    "pydantic>=2.6.0",
    "cryptography>=42.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
